[project]
name = "verified-github-agent"
version = "0.1.0"
description = "Verified GitHub Development Agent Blueprint with AgentGate Guardrails"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
