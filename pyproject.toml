[project]
name = "agentgate"
version = "0.5.0"
description = "Deterministic execution gate and audit ledger for LLM tool calls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "google-adk>=2.13.0",
    "google-genai>=2.34.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate", "blueprints"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "blueprints",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[project.scripts]
agentgate = "agentgate.cli:main"
gate = "agentgate.cli:main"
agentgate-mcp = "agentgate.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
