[project]
name = "agentgate"
version = "0.1.0"
description = "Deterministic execution gate and audit ledger for LLM tool calls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "google-adk>=2.11.0",
    "google-genai>=2.28.0",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate", "blueprints"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "blueprints",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[project.scripts]
agentgate = "agentgate.cli:main"
gate = "agentgate.cli:main"
agentgate-mcp = "agentgate.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
