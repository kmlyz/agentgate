[project]
name = "agentgate"
version = "0.1.0"
description = "Deterministic Guardrails & Human-in-the-Loop Gate for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "google-adk>=2.0.0",
    "google-genai>=1.0.0",
    "mcp>=2.3.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate", "blueprints"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "blueprints",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[project.scripts]
agentgate = "agentgate.cli:main"
gate = "agentgate.cli:main"
agentgate-mcp = "agentgate.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
